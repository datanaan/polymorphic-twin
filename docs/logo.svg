<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2a900"/>
      <stop offset="100%" style="stop-color:#e6b800"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8892b0"/>
      <stop offset="100%" style="stop-color:#a8b2d1"/>
    </linearGradient>
  </defs>

  <!-- Background: shield shape for "trust" -->
  <path d="M200,30 L330,80 L330,200 Q330,300 200,370 Q70,300 70,200 L70,80 Z"
        fill="url(#bg)" stroke="#f2a900" stroke-width="2" opacity="0.9"/>

  <!-- Inner shield outline -->
  <path d="M200,55 L305,95 L305,195 Q305,280 200,340 Q95,280 95,195 L95,95 Z"
        fill="none" stroke="#f2a900" stroke-width="1.5" opacity="0.3"/>

  <!-- Twin circles (representing digital twin) -->
  <circle cx="155" cy="175" r="50" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <circle cx="245" cy="175" r="50" fill="none" stroke="url(#silver)" stroke-width="3" opacity="0.6"/>

  <!-- Overlapping region (the trust decision) -->
  <path d="M175,145 Q200,125 225,145 Q240,165 225,185 Q200,205 175,185 Q160,165 175,145 Z"
        fill="url(#gold)" opacity="0.25"/>

  <!-- Vertical line through center = adjudication -->
  <line x1="200" y1="120" x2="200" y2="230" stroke="#f2a900" stroke-width="1.5" opacity="0.2"/>

  <!-- Checkmark in overlapping region -->
  <polyline points="185,175 195,188 215,162"
            fill="none" stroke="#f2a900" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Bottom bar - "TRUST" -->
  <rect x="140" y="290" width="120" height="2" rx="1" fill="#f2a900" opacity="0.3"/>

  <!-- P T letters -->
  <text x="200" y="318" font-family="'Georgia', serif" font-size="22"
        fill="#f2a900" text-anchor="middle" opacity="0.8" letter-spacing="8">PT</text>

  <!-- Small decorative dots -->
  <circle cx="200" cy="95" r="3" fill="#f2a900" opacity="0.4"/>
  <circle cx="200" cy="345" r="3" fill="#f2a900" opacity="0.4"/>
  <circle cx="110" cy="155" r="2" fill="#8892b0" opacity="0.3"/>
  <circle cx="290" cy="155" r="2" fill="#8892b0" opacity="0.3"/>
</svg>
