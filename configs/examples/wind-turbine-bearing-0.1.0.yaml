# configs/examples/wind-turbine-bearing-0.1.0.yaml
# Polymorphic-Twin DomainPack: Wind Turbine Bearing Degradation Monitoring
# Scenario: Offshore wind turbine main bearing condition monitoring

domain_id: "wind_turbine.bearing_monitor"
domain_name: "风机轴承退化监测"
domain_version: "0.1.0"

# ── 继承策略 ──
inheritance_policy:
  can_relax_parent_absolute_constraints: false
  can_lower_parent_criticality: false
  conflict_resolution: "stricter_wins"
  parent_update_action: "require_recertification"
  parent_retirement_action_by_reason:
    safety_issue: "immediate_degrade_and_require_recertification"
    superseded: "mark_requires_upgrade_with_deadline"
    obsolete: "warn_and_prohibit_new_instantiation"
    administrative: "human_review_required"

# ── 刚性-关键性兼容规则 ──
rigidity_criticality_compatibility:
  safety_critical: "must_be_absolute"
  identity_critical: "absolute_or_strictly_audited"
  operational: "absolute_or_soft_or_learnable"
  informational: "soft_or_learnable"

# ── 状态语义 ──
state_semantics_template:
  ontology_reference: "wind_turbine:bearing_monitor"
  variables:
    - name: "vibration_freq"
      physical_meaning: "轴承振动主频率"
      unit: "Hz"
      range_min: 0.0
      range_max: 5000.0
      observability: "observable"
      controllability: "uncontrollable"
      measurement_source: "accelerometer_bearing"
      required: true

    - name: "bearing_temp"
      physical_meaning: "轴承温度"
      unit: "celsius"
      range_min: -40.0
      range_max: 150.0
      observability: "observable"
      controllability: "partially_controllable"
      measurement_source: "thermocouple_bearing"
      required: true

    - name: "rotor_speed"
      physical_meaning: "转子转速"
      unit: "RPM"
      range_min: 0.0
      range_max: 30.0
      observability: "observable"
      controllability: "partially_controllable"
      measurement_source: "encoder_rotor"
      required: true

    - name: "power_output"
      physical_meaning: "发电功率输出"
      unit: "kW"
      range_min: 0.0
      range_max: 5000.0
      observability: "observable"
      controllability: "uncontrollable"
      measurement_source: "power_meter_generator"
      required: true

    - name: "oil_quality_index"
      physical_meaning: "润滑油质量指数"
      unit: "ratio"
      range_min: 0.0
      range_max: 1.0
      observability: "observable"
      controllability: "uncontrollable"
      measurement_source: "oil_analyzer"
      required: true

# ── 约束卡片 ──
constraint_cards:
  knowledge_base_reference: "wind_turbine:bearing_monitor:constraints"

  absolute:
    # 安全关键约束：振动频率上限
    - constraint_id: "vibration_limit"
      scenario_criticality: "safety_critical"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "vibration_freq"
            min: 0.0
            max: 5000.0
            inclusive: true
          - type: "sensor_status"
            sensor_id: "accelerometer_bearing"
            required_status: "active"
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "vibration_freq"
          max: 2500.0
          inclusive: true
      tolerance:
        absolute: 100.0
      violation_priority: 1

    # 身份关键约束：温度-转速物理耦合范围
    - constraint_id: "temp_speed_coupling"
      scenario_criticality: "identity_critical"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "rotor_speed"
            min: 1.0
            max: 30.0
            inclusive: true
          - type: "identity_confidence"
            min_confidence: 0.7
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "bearing_temp"
          max: 120.0
          inclusive: true
      tolerance:
        percentage: 15.0
      violation_priority: 2

    # 操作约束：功率输出额定范围
    - constraint_id: "power_output_range"
      scenario_criticality: "operational"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "rotor_speed"
            min: 5.0
            max: 30.0
            inclusive: true
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "power_output"
          min: 100.0
          max: 5000.0
          inclusive: true
      tolerance:
        percentage: 5.0
      violation_priority: 3

  soft:
    # 操作约束：润滑油质量目标
    - constraint_id: "oil_quality_target"
      weight: 0.7
      scenario_criticality: "operational"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "rotor_speed"
            min: 1.0
            max: 30.0
            inclusive: true
        match_mode: "all"
      validation:
        method: "threshold_exceeded"
        config:
          variable: "oil_quality_index"
          min: 0.7

  learnable: []

# ── 安全回落策略 ──
safe_fallback:
  policy_id: "wind_turbine_bearing_shutdown"
  domain_of_validity:
    conditions: []
    match_mode: "all"
  verified_initial_set:
    - vibration_freq: 0.0
      bearing_temp: 25.0
      rotor_speed: 0.0
      power_output: 0.0
      oil_quality_index: 1.0
  invariant_safe_set:
    - vibration_freq: [0.0, 500.0]
      bearing_temp: [0.0, 40.0]
  robustness_margin: 0.15
  target_state:
    state_description: "安全停机：转子停止，振动归零，温度降至环境温度"
    state_parameters:
      vibration_freq: 0.0
      bearing_temp: 25.0
      rotor_speed: 0.0
      power_output: 0.0
      oil_quality_index: 1.0
  trajectory_constraints:
    max_rate:
      rotor_speed: 2.0  # RPM/s
      bearing_temp: 5.0  # °C/s
    forbidden_zones:
      - vibration_freq: [2000, 5000]
        rotor_speed: [20, 30]
  max_duration: "PT15M"
  unavailable_action: "safe_shutdown"
  post_fallback_action: "hold"
  verification_record:
    verified_in_simulation: false
    verified_scenarios: []
    last_verification_date: "2026-05-01T00:00:00Z"

# ── 行动模板 ──
action_templates:
  knowledge_base_reference: "wind_turbine:bearing_monitor:actions"

  immediate_action_types:
    - action_type_id: "observe_bearing"
      description_template: "观测轴承当前状态"
      applicable_when: []
      monitoring_requirements:
        - "accelerometer_bearing"
        - "thermocouple_bearing"
        - "encoder_rotor"
      fallback_if_fails: "hold"

    - action_type_id: "reduce_speed"
      description_template: "降低转子转速"
      applicable_when:
        - "rotor_speed > 0"
        - "fallback_available == true"
      monitoring_requirements:
        - "encoder_rotor"
        - "power_meter_generator"
      fallback_if_fails: "safe_shutdown"

  conditional_action_types:
    - action_type_id: "replace_bearing"
      description_template: "更换轴承"
      typical_prerequisites:
        - "operating_mode == 'maintenance'"
        - "safety_permit_issued == true"
      risk_profile:
        risk_level: "high"
        reversible: false

  forbidden_action_types:
    - action_type_id: "override_vibration_limit"
      description_template: "覆盖振动安全限制"
      typical_prohibition_reasons:
        - "safety_critical 约束不可覆盖"
    - action_type_id: "force_full_speed"
      description_template: "强制满速运行"
      typical_prohibition_reasons:
        - "需要 Core 资格验证"

# ── 人类角色 ──
human_roles:
  - role_id: "technician"
    role_name: "现场技术员"
    authorized_action_types: ["observe_bearing", "reduce_speed"]
    exception_request_authority:
      can_request_review: true
      can_request_recertification: false
      can_request_constraint_revision: false
      can_initiate_human_takeover: true
      can_initiate_safe_shutdown: true
    approval_required_for: []

  - role_id: "engineer"
    role_name: "维护工程师"
    authorized_action_types: ["observe_bearing", "reduce_speed", "replace_bearing"]
    exception_request_authority:
      can_request_review: true
      can_request_recertification: true
      can_request_constraint_revision: true
      can_initiate_human_takeover: true
      can_initiate_safe_shutdown: true
    approval_required_for: ["replace_bearing"]

# ── 验证集引用 ──
validation_sets:
  public_eval_set_reference: "wind_turbine:bearing_monitor:public_eval"
  audit_benchmark_reference: "wind_turbine:bearing_monitor:audit_benchmark"
  production_acceptance_reference: "wind_turbine:bearing_monitor:production_acceptance"

# ── 身份监控配置 ──
identity_monitor_config:
  identity_check_interval: 2.0
  drift_tolerance: 0.05
  drift_trend_window: 500
  drift_trend_threshold: 0.02
  identity_uncertain_timeout: 60.0

# ── 元信息 ──
created_at: "2026-05-20T00:00:00Z"
last_modified_at: "2026-05-20T00:00:00Z"
certified_by: "initial_design"
certification_date: "2026-05-20T00:00:00Z"
applicability_scope: "海上风机主轴承退化监测场景"
