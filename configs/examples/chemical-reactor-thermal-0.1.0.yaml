# configs/examples/chemical-reactor-thermal-0.1.0.yaml
# Polymorphic-Twin DomainPack: Chemical Reactor Temperature Control
# Scenario: CSTR continuous stirred-tank reactor thermal management

domain_id: "cstr.thermal_control"
domain_name: "化工反应器温度控制"
domain_version: "0.1.0"

# ── 继承策略 ──
inheritance_policy:
  can_relax_parent_absolute_constraints: false
  can_lower_parent_criticality: false
  conflict_resolution: "stricter_wins"
  parent_update_action: "require_recertification"
  parent_retirement_action_by_reason:
    safety_issue: "immediate_degrade_and_require_recertification"
    superseded: "mark_requires_upgrade_with_deadline"
    obsolete: "warn_and_prohibit_new_instantiation"
    administrative: "human_review_required"

# ── 刚性-关键性兼容规则 ──
rigidity_criticality_compatibility:
  safety_critical: "must_be_absolute"
  identity_critical: "absolute_or_strictly_audited"
  operational: "absolute_or_soft_or_learnable"
  informational: "soft_or_learnable"

# ── 状态语义 ──
state_semantics_template:
  ontology_reference: "cstr:thermal_control"
  variables:
    - name: "reactor_temp"
      physical_meaning: "反应器核心温度"
      unit: "celsius"
      range_min: -20.0
      range_max: 400.0
      observability: "observable"
      controllability: "partially_controllable"
      measurement_source: "thermocouple_reactor_core"
      required: true

    - name: "coolant_flow"
      physical_meaning: "冷却剂流量"
      unit: "L/min"
      range_min: 0.0
      range_max: 100.0
      observability: "observable"
      controllability: "controllable"
      measurement_source: "flow_meter_coolant"
      required: true

    - name: "reaction_rate"
      physical_meaning: "化学反应速率"
      unit: "mol/s"
      range_min: 0.0
      range_max: 50.0
      observability: "observable"
      controllability: "uncontrollable"
      measurement_source: "spectrometer_outlet"
      required: true

    - name: "product_quality"
      physical_meaning: "产出质量指标"
      unit: "percentage"
      range_min: 0.0
      range_max: 100.0
      observability: "observable"
      controllability: "partially_controllable"
      required: true

    - name: "vessel_pressure"
      physical_meaning: "容器内部压力"
      unit: "bar"
      range_min: 0.0
      range_max: 20.0
      observability: "observable"
      controllability: "controllable"
      measurement_source: "pressure_gauge_vessel"
      required: true

# ── 约束卡片 ──
constraint_cards:
  knowledge_base_reference: "cstr:thermal_control:constraints"

  absolute:
    # 安全关键约束：反应器温度上限
    - constraint_id: "temp_upper_limit"
      scenario_criticality: "safety_critical"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "reactor_temp"
            min: -20.0
            max: 400.0
            inclusive: true
          - type: "sensor_status"
            sensor_id: "thermocouple_reactor_core"
            required_status: "active"
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "reactor_temp"
          max: 350.0
          inclusive: true
      tolerance:
        absolute: 5.0
      violation_priority: 1

    # 安全关键约束：容器压力上限
    - constraint_id: "pressure_upper_limit"
      scenario_criticality: "safety_critical"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "vessel_pressure"
            min: 0.0
            max: 20.0
            inclusive: true
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "vessel_pressure"
          max: 15.0
          inclusive: true
      tolerance:
        absolute: 0.5
      violation_priority: 1

    # 身份关键约束：反应速率阿伦尼乌斯方程一致性
    - constraint_id: "reaction_rate_arrhenius"
      scenario_criticality: "identity_critical"
      domain_of_validity:
        conditions:
          - type: "identity_confidence"
            min_confidence: 0.7
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "reaction_rate"
          min: 0.0
          max: 50.0
          inclusive: true
      tolerance:
        percentage: 20.0
      violation_priority: 2

    # 操作约束：冷却能力与产热平衡
    - constraint_id: "coolant_heat_balance"
      scenario_criticality: "operational"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "reactor_temp"
            min: 50.0
            max: 350.0
            inclusive: true
          - type: "state_range"
            variable: "coolant_flow"
            min: 0.0
            max: 100.0
            inclusive: true
        match_mode: "all"
      validation:
        method: "range_check"
        config:
          variable: "coolant_flow"
          min: 5.0
          inclusive: true
      tolerance:
        percentage: 10.0
      violation_priority: 3

  soft:
    # 操作约束：产出质量目标
    - constraint_id: "product_quality_target"
      weight: 0.8
      scenario_criticality: "operational"
      domain_of_validity:
        conditions:
          - type: "state_range"
            variable: "reaction_rate"
            min: 1.0
            max: 50.0
            inclusive: true
        match_mode: "all"
      validation:
        method: "threshold_exceeded"
        config:
          variable: "product_quality"
          min: 92.0

  learnable: []

# ── 安全回落策略 ──
safe_fallback:
  policy_id: "cstr_emergency_shutdown"
  domain_of_validity:
    conditions: []
    match_mode: "all"
  verified_initial_set:
    - reactor_temp: 25.0
      coolant_flow: 0.0
      reaction_rate: 0.0
      vessel_pressure: 1.0
      product_quality: 0.0
  invariant_safe_set:
    - reactor_temp: [0.0, 30.0]
      vessel_pressure: [0.5, 2.0]
  robustness_margin: 0.15
  target_state:
    state_description: "紧急停机：反应器温度降至25°C，压力降至1 bar"
    state_parameters:
      reactor_temp: 25.0
      coolant_flow: 0.0
      reaction_rate: 0.0
      vessel_pressure: 1.0
      product_quality: 0.0
  trajectory_constraints:
    max_rate:
      reactor_temp: 15.0  # °C/s
      vessel_pressure: 3.0  # bar/s
    forbidden_zones:
      - reactor_temp: [300, 400]
        vessel_pressure: [10, 20]
  max_duration: "PT10M"
  unavailable_action: "safe_shutdown"
  post_fallback_action: "hold"
  verification_record:
    verified_in_simulation: false
    verified_scenarios: []
    last_verification_date: "2026-05-01T00:00:00Z"

# ── 行动模板 ──
action_templates:
  knowledge_base_reference: "cstr:thermal_control:actions"

  immediate_action_types:
    - action_type_id: "observe_reactor"
      description_template: "观测反应器当前状态"
      applicable_when: []
      monitoring_requirements:
        - "thermocouple_reactor_core"
        - "pressure_gauge_vessel"
        - "flow_meter_coolant"
      fallback_if_fails: "hold"

    - action_type_id: "adjust_coolant"
      description_template: "调节冷却剂流量"
      applicable_when:
        - "coolant_flow >= 0"
        - "fallback_available == true"
      monitoring_requirements:
        - "flow_meter_coolant"
        - "thermocouple_reactor_core"
      fallback_if_fails: "safe_shutdown"

  conditional_action_types:
    - action_type_id: "recalibrate_sensors"
      description_template: "重新校准传感器"
      typical_prerequisites:
        - "operating_mode == 'shutdown'"
        - "all_sensors_active == true"
      risk_profile:
        risk_level: "low"
        reversible: true

  forbidden_action_types:
    - action_type_id: "override_temp_limit"
      description_template: "覆盖温度安全限制"
      typical_prohibition_reasons:
        - "safety_critical 约束不可覆盖"
    - action_type_id: "force_max_reaction"
      description_template: "强制最大反应速率"
      typical_prohibition_reasons:
        - "需要 Core 资格验证"

# ── 人类角色 ──
human_roles:
  - role_id: "operator"
    role_name: "反应器操作员"
    authorized_action_types: ["observe_reactor", "adjust_coolant"]
    exception_request_authority:
      can_request_review: true
      can_request_recertification: false
      can_request_constraint_revision: false
      can_initiate_human_takeover: true
      can_initiate_safe_shutdown: true
    approval_required_for: []

  - role_id: "supervisor"
    role_name: "值班主管"
    authorized_action_types: ["observe_reactor", "adjust_coolant", "recalibrate_sensors"]
    exception_request_authority:
      can_request_review: true
      can_request_recertification: true
      can_request_constraint_revision: true
      can_initiate_human_takeover: true
      can_initiate_safe_shutdown: true
    approval_required_for: ["recalibrate_sensors"]

# ── 验证集引用 ──
validation_sets:
  public_eval_set_reference: "cstr:thermal_control:public_eval"
  audit_benchmark_reference: "cstr:thermal_control:audit_benchmark"
  production_acceptance_reference: "cstr:thermal_control:production_acceptance"

# ── 身份监控配置 ──
identity_monitor_config:
  identity_check_interval: 0.5
  drift_tolerance: 0.03
  drift_trend_window: 200
  drift_trend_threshold: 0.01
  identity_uncertain_timeout: 15.0

# ── 元信息 ──
created_at: "2026-05-20T00:00:00Z"
last_modified_at: "2026-05-20T00:00:00Z"
certified_by: "initial_design"
certification_date: "2026-05-20T00:00:00Z"
applicability_scope: "化工反应器CSTR温度控制场景"
